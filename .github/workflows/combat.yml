name: NIGHTKEEP combat regression
on:
  push:
    branches: [main, 'backup/**', 'combat/**']
  pull_request:
    branches: [main]
jobs:
  combat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm test
      - run: node --check server.js
      - run: node --check engine/combat-engine.js
