name: Build NIGHTKEEP PK APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'pk-auto-accept/**'
      - '.github/workflows/build-pk-auto-accept.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx2g
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android build packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" "platform-tools"
          yes | sdkmanager --licenses > /dev/null || true
      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify toolchain
        run: |
          java -version
          gradle --version
          test -f pk-auto-accept/settings.gradle.kts
      - name: Build debug APK
        working-directory: pk-auto-accept
        run: gradle --stacktrace --console=plain :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NIGHTKEEP-PK-AUTO-ACCEPT-APK
          path: pk-auto-accept/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
