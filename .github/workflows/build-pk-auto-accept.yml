name: Build NIGHTKEEP PK APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'pk-auto-accept/**'
      - '.github/workflows/build-pk-auto-accept.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: pk-auto-accept
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: NIGHTKEEP-PK-AUTO-ACCEPT-APK
          path: pk-auto-accept/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
