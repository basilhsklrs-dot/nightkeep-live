name: Build AURA PK Manager APK
on:
  push:
    branches: [feature/aura-pk-manager]
    paths: ['pk-auto-manager/**', '.github/workflows/build-aura-pk-apk.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: pk-auto-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: aura-pk-manager-alpha-apk
          path: pk-auto-manager/app/build/outputs/apk/debug/app-debug.apk
