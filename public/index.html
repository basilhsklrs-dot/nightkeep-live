<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>BUMPER BOTS LIVE</title><style>*{box-sizing:border-box}html,body{margin:0;background:#050b1b;color:white;font-family:system-ui,Arial;overflow:hidden}#game{position:absolute;inset:0}#hud{position:absolute;inset:0;pointer-events:none;display:flex;flex-direction:column;justify-content:space-between;padding:env(safe-area-inset-top) 12px 22px;text-shadow:0 2px 5px #000}header{background:linear-gradient(#071a39ee,#071a3900);padding:14px 4px}h1{font-size:clamp(21px,5vw,38px);margin:0;color:#58d9ff;letter-spacing:1px}#top{display:flex;justify-content:space-between;gap:5px;font-size:clamp(10px,2.5vw,17px);margin-top:9px}#top span{background:#102a50b8;padding:6px;border:1px solid #3673b1;border-radius:10px}#chaos-meter{font-size:clamp(11px,2.5vw,16px);font-weight:900;color:#7cfaff;background:#071a39a8;border-radius:9px;padding:4px;margin:2px auto;max-width:75%}#team-score{display:none;justify-content:space-between;gap:8px;margin:5px 0;font-size:clamp(12px,3vw,19px);font-weight:950;text-shadow:0 2px 4px #000}#team-score span{width:50%;padding:7px 5px;text-align:center;border-radius:10px}#red-score{background:#b70d37dd;border:2px solid #ff5776}#blue-score{background:#075bc3dd;border:2px solid #54b8ff}#league{font-size:clamp(12px,3vw,18px);font-weight:800;color:#ffda64;padding:3px 0;text-align:center}#timer{font-weight:900;font-size:clamp(25px,7vw,48px)}footer{background:linear-gradient(#071a3900,#071a39ee);padding:50px 5px 4px;text-align:center}#status{font-size:12px;color:#9ed6ff}#call{font-size:clamp(17px,4vw,29px);font-weight:900;color:#ffde54}#hero{position:fixed;top:18%;left:50%;transform:translateX(-50%);z-index:21;min-width:35%;max-width:80%;padding:5px 9px;background:#071a39e8;border:2px solid #ffdd59;border-radius:15px;text-align:center;color:#fff;font-weight:900;font-size:clamp(12px,3vw,17px);box-shadow:0 0 22px #ffb70077;display:none;pointer-events:none}#hero small{display:block;font-size:12px;color:#ffe782}#toast{position:fixed;top:20%;left:8%;width:84%;z-index:20;min-height:20px;padding:4px;text-align:center;font-size:clamp(12px,3vw,17px);font-weight:900;color:#fff;background:#081a3bdc;border:1px solid #ffb33b;border-radius:14px;opacity:0;transition:opacity .15s;pointer-events:none;text-shadow:0 2px 8px #000}#toast.show{opacity:1}#start{position:absolute;top:45%;left:50%;transform:translate(-50%,-50%);background:#13a6ea;border:0;color:#fff;border-radius:14px;padding:18px 30px;font-weight:900;font-size:20px;z-index:5}#start:disabled{opacity:.4}#fullscreen-toggle{position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;pointer-events:auto;background:rgba(9,24,52,.85);border:1px solid #57d9ff;border-radius:12px;color:white;width:48px;height:48px;font-size:23px;cursor:pointer;box-shadow:0 2px 12px #0008;touch-action:manipulation}#fullscreen-toggle:focus-visible{outline:3px solid #fff}#victory-overlay{position:fixed;top:30%;left:5%;width:90%;z-index:28;pointer-events:none;text-align:center;padding:22px 12px;border-radius:22px;border:3px solid var(--victory-color,#ffd54a);background:linear-gradient(135deg,#06152af5,#15264af5);box-shadow:0 0 45px var(--victory-color,#ffd54a);opacity:0;transform:scale(.8);transition:opacity .35s,transform .35s}#victory-overlay.visible{opacity:1;transform:scale(1)}.victory-title{font-size:clamp(23px,6vw,43px);font-weight:1000;color:var(--victory-color,#ffd54a);text-shadow:0 0 20px currentColor}.victory-reward{font-size:clamp(12px,3.1vw,21px);font-weight:850;color:#fff3c2;margin:14px 0}.victory-players{font-size:clamp(13px,3vw,19px);color:#fff;font-weight:800}</style></head><body><div id="game"></div><div id="victory-overlay"><div class="victory-title"></div><div class="victory-reward"></div><div class="victory-players"></div></div><div id="hud"><div id="hero"></div><header><h1>⚡ BUMPER BOTS LIVE</h1><div id="timer">03:00</div><div id="chaos-meter" aria-live="off">🌩️ CHAOS 0/500 LIKES</div><div id="team-score"><span id="red-score">🔴 RED 0 DMG</span><span id="blue-score">🔵 BLUE 0 DMG</span></div><div id="event-banner" style="display:none;background:linear-gradient(90deg,#17213de8,#412347e8);border:2px solid #ffd76c;border-radius:12px;padding:9px;text-align:center;font-size:clamp(12px,3vw,20px);font-weight:900;letter-spacing:.5px;color:#fff4b9;box-shadow:0 0 20px #e4a13c70"></div><div id="league">🏆 ROUND 1/5 • CHAMPIONSHIP</div><div id="top"><span id="p1">🥇 —</span><span id="p2">🥈 —</span><span id="p3">🥉 —</span></div></header><footer><div id="toast"></div><div id="call">❤️ 100 LIVE LIKES = TEAM CHARGE • 500 = MEGA SHIELD!</div><div>⚡ TAP COMBO • 🎁 BIGGER GIFTS = STRONGER POWER • 🏆 TOP DAMAGE WINS</div><div id="status">Connecting to LIVE...</div></footer></div><button id="fullscreen-toggle" type="button" aria-label="Enter fullscreen" title="Fullscreen">⛶</button><button id="start">START GAME & SOUND</button><script>window.addEventListener('error',e=>{const st=document.querySelector('#status');if(st&&st.textContent.includes('Connecting'))st.textContent='GAME ERROR: '+String(e.message||'script load').slice(0,75);});window.addEventListener('unhandledrejection',e=>{const st=document.querySelector('#status');if(st&&st.textContent.includes('Connecting'))st.textContent='LOAD ERROR: '+String(e.reason||'network').slice(0,75);});setTimeout(()=>{const st=document.querySelector('#status');if(st&&st.textContent.includes('Connecting'))st.textContent='GAME CONNECTION TIMEOUT — RELOAD';},12000);</script><script type="module" src="/bumper.js"></script><script>(()=>{const b=document.getElementById('fullscreen-toggle');function sync(){const on=!!document.fullscreenElement;b.textContent=on?'⤢':'⛶';b.setAttribute('aria-label',on?'Exit fullscreen':'Enter fullscreen');b.title=on?'Exit fullscreen':'Enter fullscreen';}b.addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await document.documentElement.requestFullscreen();}catch(e){console.warn('Fullscreen unavailable',e);}sync();});document.addEventListener('fullscreenchange',sync);sync();})();</script></body></html>
